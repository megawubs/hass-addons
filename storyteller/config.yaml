# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: "Storyteller"
# Plain semver on purpose: Home Assistant parses add-on versions with
# AwesomeVersion, and anything that is not a bare version string (the old
# "web-v1.4.0-ctc.6" included) parses as UNKNOWN and cannot be compared. The
# upstream tag that goes with this lives in the Dockerfile.
version: "2.14.21"
slug: storyteller
description: "Self-hosted platform for creating and reading ebooks with synced narration"
url: "https://gitlab.com/storyteller-platform/storyteller"
arch:
  # Upstream only publishes amd64 and arm64 images; there has never been an
  # armv7 build to pull.
  - aarch64
  - amd64
ports:
  8001/tcp: 8001
ports_description:
  8001/tcp: "Storyteller web interface"
panel_icon: mdi:headphones
init: false
webui: "http://[HOST]:[PORT:8001]"
map:
  - media:rw
  - share:rw
  - addon_config:rw
options:
  log_level: info
  enable_web_reader: false
schema:
  log_level: list(error|warn|info|debug|trace)
  enable_web_reader: bool
  secret_key: password?
  auth_url: str?

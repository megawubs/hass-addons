name: "Bookclerk"
version: "0.1.0-60263a4"
slug: bookclerk
description: "Multi-storefront audiobook library manager (Audible, Libro.fm, Chirp, GraphicAudio) with a web UI"
url: "https://github.com/fritz-fritz/bookclerk"
arch:
  - aarch64
  - amd64
image: "ghcr.io/megawubs/hass-addons/bookclerk-{arch}"
init: false
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: "Bookclerk web UI and API"
webui: "http://[HOST]:[PORT:8787]"
panel_icon: mdi:bookshelf-music
map:
  - media:rw
options:
  auth_password: ""
  auto_acquire: false
  output_path: "Audiobooks"
  log_level: "info"
  plugin_isolation: "best-effort"
  graphicaudio_access: "web"
  graphicaudio_accounts: []
  libro_fm_accounts: []
  chirp_accounts: []
  audible_marketplaces: []
schema:
  auth_password: password
  auto_acquire: bool
  output_path: str
  log_level: str
  plugin_isolation: list(required|best-effort|off)
  graphicaudio_access: list(web|zip|device)
  graphicaudio_accounts:
    - email: str
      password: password
  libro_fm_accounts:
    - email: str
      password: password
  chirp_accounts:
    - email: str
      password: password
  audible_marketplaces: ["str"]

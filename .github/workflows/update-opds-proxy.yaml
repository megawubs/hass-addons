name: Update OPDS Proxy
on:
  schedule:
    # Once a day.
    - cron: '0 0 * * *'
  # allow manual trigger
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  check-opds-proxy-version:
    name: Check OPDS Proxy version
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release tag and update YAML file
        run: |
          set -euo pipefail

          # Pick the highest semver tag rather than trusting the order the API
          # happens to return, and drop the "v" that the git tags carry but the
          # published image tags do not.
          latest_version=$(curl -sfL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/evan-buss/opds-proxy/tags?per_page=100" \
            | jq -r '.[].name' \
            | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)

          current_version=$(grep -Po '(?<=version: ")[^"]+' opds-proxy/config.yaml)

          if [[ -z "${latest_version}" ]]; then
            echo "Could not determine the latest version, keeping ${current_version}."
            exit 0
          fi

          if [[ "${latest_version}" == "${current_version}" ]]; then
            echo "Already on ${current_version}."
            exit 0
          fi

          # The add-on builds FROM the upstream image, so a git tag alone is not
          # enough: bumping before the image is published would break the build
          # on every installation.
          if ! docker manifest inspect \
              "ghcr.io/evan-buss/opds-proxy:${latest_version}" > /dev/null 2>&1; then
            echo "Tag ${latest_version} has no published image yet, skipping."
            exit 0
          fi

          echo "Bumping ${current_version} -> ${latest_version}"
          sed -i "s/version: \".*\"/version: \"${latest_version}\"/" opds-proxy/config.yaml
          sed -i "s/^ARG OPDS_PROXY_VERSION=.*/ARG OPDS_PROXY_VERSION=${latest_version}/" opds-proxy/Dockerfile

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: Bump opds-proxy version
